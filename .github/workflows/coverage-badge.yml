name: coverage-badge

# Publishes the measured line-coverage percentage as a shields.io endpoint
# file on the `badges` branch, so README.md can render a number that came from
# a real run.
#
# repository-baseline-policy.md §5.1 forbids a hand-set badge outright: it
# renders identically to a real one, so a reader cannot tell them apart, and it
# becomes false the moment reality moves without anyone editing a file. §5.3
# requires a coverage badge on Tier A/B repos, so "no badge" is not an option
# either — the only compliant answer is a generated one (symposion-I114).
#
# In-house on purpose. The alternatives were a gist plus a classic PAT (a new
# long-lived credential whose only job is rendering a number) or a third-party
# coverage vendor (repo access, and this repo is public). Both buy presentation
# with a permanent cost; this buys it with a branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    name: publish coverage badge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job alone. The rest of ci.yml keeps `permissions: {}` —
    # write access exists here only to push one JSON file to a branch that
    # contains nothing else.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Measure coverage
        id: cov
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee /tmp/cov.txt
          # c8's text-summary line: "Lines        : 34.78% ( 1695/4873 )"
          PCT=$(grep -oE '^Lines[[:space:]]*:[[:space:]]*[0-9.]+' /tmp/cov.txt | grep -oE '[0-9.]+$' | head -1)
          if [ -z "$PCT" ]; then
            echo "could not parse a coverage percentage from the run output" >&2
            echo "refusing to publish a badge rather than publishing a wrong one" >&2
            exit 1
          fi
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          echo "Measured line coverage: $PCT%"

      - name: Build the shields endpoint payload
        run: |
          PCT="${{ steps.cov.outputs.pct }}"
          # Colour thresholds are deliberately honest rather than flattering:
          # at 34% this renders red, and it should, until the index.mjs
          # extraction (symposion-I39) moves it.
          INT=${PCT%.*}
          if   [ "$INT" -ge 90 ]; then COLOR=brightgreen
          elif [ "$INT" -ge 75 ]; then COLOR=green
          elif [ "$INT" -ge 60 ]; then COLOR=yellowgreen
          elif [ "$INT" -ge 40 ]; then COLOR=orange
          else                          COLOR=red
          fi
          mkdir -p out
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$COLOR" > out/coverage.json
          cat out/coverage.json

      - name: Publish to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Orphan branch: it carries badge payloads and nothing else, so it
          # never needs the history of main and can never conflict with it.
          git fetch origin badges --depth=1 2>/dev/null && git checkout badges || git checkout --orphan badges
          find . -maxdepth 1 -mindepth 1 ! -name .git ! -name out -exec rm -rf {} +
          mv out/coverage.json ./coverage.json
          rmdir out 2>/dev/null || true
          git add coverage.json
          if git diff --cached --quiet; then
            echo "coverage unchanged — nothing to publish"
            exit 0
          fi
          git commit -m "chore(badges): coverage ${{ steps.cov.outputs.pct }}%"
          git push origin badges
